<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003876"/>
      <stop offset="100%" style="stop-color:#002a5c"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Subtle accent line (representing data/statistics) -->
  <line x1="8" y1="52" x2="56" y2="52" stroke="#C4A661" stroke-width="2" opacity="0.4"/>
  <polyline points="10,46 22,38 34,42 46,30 56,34" fill="none" stroke="#C4A661" stroke-width="1.5" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- LSJ initials -->
  <text x="32" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#C4A661" text-anchor="middle" letter-spacing="-0.5">LSJ</text>
</svg>
